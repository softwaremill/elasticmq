include classpath("application.conf")

node-address {
  port = 9324
}

rest-sqs {
  bind-port = 9324
}

messages-storage {
  enabled = true
  # Local:
  # uri = "jdbc:h2:./data/storage"
  # From docker:
  uri = "jdbc:h2:/data/storage"
}

auto-create-queues {
  enabled = false
  template {
    default-visibility-timeout = 30 seconds
    tags {
        type = "dynamic"
    }
  }
}

queues {
  01-simple-queue { }

  02-queue-with-dead-letter {
    default-visibility-timeout = 10 seconds
    delay = 5 seconds
    receive-message-wait = 0 seconds
    dead-letters-queue {
      name = "03-dead-letter-queue"
      max-receive-count = 3
    }
  }

  03-dead-letter-queue { }

  04-fifo-queue {
    fifo = true
    content-based-deduplication = true
  }
}
