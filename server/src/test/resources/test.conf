# What is the outside visible address of this ElasticMQ node
# Used to create the queue URL (may be different from bind address!)
node-address {
  protocol = "http"
  host = "localhost"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Possible values: relaxed, strict
  sqs-limits = strict
}

# Should the node-address be generated from the bind port/hostname
# Set this to true e.g. when assigning port automatically by using port 0.
generate-node-address = false

queues-storage {
  enabled = false
  path = ""
}

queues {
  myDLQ {

  }

  queueName1 {
    default-visibility-timeout = 10 seconds
    delay = 5 seconds
    receive-message-wait = 0 seconds
    dead-letters-queue {
      name = "myDLQ"
      max-receive-count = 3
    }
  }

  fifoQueue {
    default-visibility-timeout = 10 seconds
    delay = 5 seconds
    receive-message-wait = 0 seconds
    dead-letters-queue {
      name = "myDLQ"
      max-receive-count = 3
    }
    fifo = true
    content-based-deduplication = true
  }

  auditQueue {

  }

  redirectToQueue {

  }

  queueWithAudit {
    copy-to = "auditQueue"
  }

  queueWithRedirect {
    move-to = "redirectToQueue"
  }

  queueWithTags {
    tags {
      "tag1" = "tagged1"
      "tag2" = "tagged2"
    }
  }
}

aws {
  region = "elastic"
  account-id = "1111111"
}