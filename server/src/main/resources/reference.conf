# What is the outside visible address of this ElasticMQ node
# Used to create the queue URL (may be different from bind address!)
# With host = "*" (the default), queue URLs use the protocol, host and port of the incoming request,
# and the context-path below; protocol and port are then ignored.
node-address {
  protocol = "http"
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Possible values: relaxed, strict
  sqs-limits = strict
}

# Should the node-address be generated from the bind port/hostname
# Set this to true e.g. when assigning port automatically by using port 0.
generate-node-address = false

queues {
#  queueName1 {
#     // all optional
#     default-visibility-timeout = 10 seconds
#     delay = 5 seconds
#     receive-message-wait = 0 seconds
#     dead-letters-queue {
#       // all mandatory
#       name = "myDLQ"
#       max-receive-count = 3
#     }
#     fifo = false
#     content-based-deduplication = false
#     copy-to = "audit-queue-name"
#     move-to = "redirect-queue-name"
#     tags {
#       tag1 = "tagged1",
#       tag2 = "tagged2"
#     }
#  }
}

queues-storage {
  enabled = false
  path = ""
}

aws {
  region = "elasticmq"
  account-id = "000000000000"
}

messages-storage {
  enabled = false
  driver-class = "org.h2.Driver"
  uri = "jdbc:h2:/data/elasticmq-h2"
  username = ""
  password = ""
  prune-data-on-init = false
}