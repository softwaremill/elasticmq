include classpath("application.conf")

node-address {
  port = 9321
}

rest-sqs {
  bind-port = 9321
}

queues-storage {
  enabled = true
  path = "/elasticmq/data/queues.conf"
}

messages-storage {
  enabled = true
  uri = "jdbc:h2:/elasticmq/data/storage"
}

queues {
  queueName1 {
    default-visibility-timeout = 10 seconds
    delay = 5 seconds
    receive-message-wait = 0 seconds
    dead-letters-queue {
      name = "myDLQ"
      max-receive-count = 3
    }
  }

  myDLQ { }

  fifoQueue {
    default-visibility-timeout = 10 seconds
    delay = 5 seconds
    receive-message-wait = 0 seconds
    dead-letters-queue {
      name = "myDLQ"
      max-receive-count = 3
    }
    fifo = true
    content-based-deduplication = true
  }

  auditQueue {

  }

  redirectToQueue {

  }

  queueWithAudit {
    copy-to = "auditQueue"
  }

  queueWithRedirect {
    move-to = "redirectToQueue"
  }

  queueWithTags {
    tags {
      "tag1" = "tagged1"
      "tag2" = "tagged2"
    }
  }
}
